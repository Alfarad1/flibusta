<?php
global $url, $book, $dbh;
// адрес /read/<id>: id приходит вместо действия
$url->var1 = intval($url->action) ?: $url->var1;
$stmt = $dbh->prepare("SELECT b.* FROM libbook b WHERE bookid=:id AND deleted='0' LIMIT 1");
$stmt->execute([':id' => $url->var1]);
$book = $stmt->fetch() ?: null;
$url->title = $book ? $book->title : 'Книга не найдена';
